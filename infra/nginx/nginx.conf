# Single entry point for the whole platform. Every service is reachable
# through this one port, so clients see a single API:
#
#   /auth/*, /.well-known/*   -> auth-api  (login, register, me, JWKS)
#   everything else           -> app-apis  (banking API, /health, /docs)
#
# /docs on app-apis merges the auth API's OpenAPI spec (DOCS_MERGE_SPEC_URLS),
# so the gateway serves one combined Swagger UI for both services.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream auth_api {
    server auth-api:3001;
  }

  upstream app_apis {
    server app-apis:3000;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/ {
      proxy_pass http://auth_api;
    }

    location /.well-known/ {
      proxy_pass http://auth_api;
    }

    location / {
      proxy_pass http://app_apis;
    }
  }
}
