packages:
  - apps/*
  - packages/*
  - tooling/*

# Shared dependency versions — packages reference these with "catalog:"
# so every workspace stays on the same version (create-t3-turbo pattern).
catalog:
  # runtime
  express: ^5.2.1
  cors: ^2.8.6
  dotenv: ^17.4.2
  drizzle-orm: ^0.45.2
  pg: ^8.22.0
  pino: ^10.3.1
  pino-http: ^11.0.0
  zod: ^4.4.3
  zod-openapi: ^6.0.0
  swagger-ui-express: ^5.0.1
  bullmq: ^5.81.2
  ioredis: ^5.11.1
  jose: ^6.2.4
  bcryptjs: ^3.0.3
  # tooling
  typescript: ^5.9.3
  tsx: ^4.23.1
  tsup: ^8.5.1
  vitest: ^4.1.10
  supertest: ^7.2.2
  drizzle-kit: ^0.31.10
  eslint: ^10.8.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.65.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.6
  '@testcontainers/postgresql': ^12.0.4
  '@testcontainers/redis': ^12.0.4
  '@types/node': ^26.1.2
  '@types/express': ^5.0.6
  '@types/cors': ^2.8.19
  '@types/pg': ^8.20.0
  '@types/supertest': ^7.2.1
  '@types/swagger-ui-express': ^4.1.8

allowBuilds:
  '@scarf/scarf': false
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  ssh2: false
